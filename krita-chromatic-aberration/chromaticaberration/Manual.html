<h2>Chromatic Aberration</h2>
Applies customizable chromatic aberration filter to image.
<h3>Basic Options</h3>
<ul>
    <li>Hue - Changes the color of the aberration</li>
    <li>Alpha Lock - Alpha locks filter to original layer</li>
    <li>Duplicate Original - Duplicates original layer - recommended if you want to undo the filter</li>
</ul>
